<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #16202e;
            --muted: #5d6b7e;
            --page: #eceef2;
            --card: #ffffff;
            --line: #d8dde5;
            --accent: #ffc733;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--line);
            background: var(--card);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo span {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--accent);
            font-size: 17px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--card);
        }

        .card h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            color: var(--ink);
            background: #f7f8fa;
        }

        input::placeholder { color: #9aa5b4; }

        input:focus {
            outline: 2px solid var(--ink);
            outline-offset: 1px;
            background: var(--card);
        }
        .playBtn  {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .playBtn:hover { background: #ffd45c; }

        .playBtn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .playBtn:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><span>?</span>QuizMaker</div>
    </header>

   <main>
    <div class="card">
       <!-- skjemaet sendes med index.js, ikke vanlig submit -->
       <form id="quizForm">
            <h1>Lag en quiz</h1>
            <p>Skriv et tema og få spørsmål om det. AI-en sjekker svarene dine når du er ferdig.</p>

            <input id="topic" name="topic" type="text" placeholder="Tema" required>
            <!-- feilmelding fra serveren, vises bare når noe går galt -->
            <p class="errormsg" style="display: none;"></p>
            <input id="count" name="count" type="number" min="1" max="15" value="5" required>

            <button class="playBtn" type="submit">Start</button>
        </form>
    </div>

</main>
<script src="index.js"></script>
</body>
</html>
