<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            color: #16202e;
            background: #eceef2;
        }

        header {
            padding: 20px 28px;
            background: white;
            border-bottom: 1px solid #d8dde5;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #ffc733;
            font-size: 17px;
        }

        .card {
            max-width: 520px;
            margin: 40px auto;
            padding: 32px;
            background: white;
            border: 1px solid #d8dde5;
            border-radius: 18px;
        }

        h1 {
            margin: 0;
        }

        #score {
            margin: 0;
            font-size: 44px;
            font-weight: bold;
        }

        #msg {
            color: #5d6b7e;
        }

        .answer {
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #f7f8fa;
            border-left: 5px solid gray;
            border-radius: 8px;
        }

        .answer h3 {
            margin: 4px 0;
            font-size: 16px;
        }

        .answer p {
            margin: 4px 0;
        }

        .right {
            border-left-color: green;
        }

        .wrong {
            border-left-color: red;
        }

        .status {
            font-size: 12px;
            font-weight: bold;
        }

        .feedback {
            color: #5d6b7e;
            font-style: italic;
        }

        .newBtn {
            display: block;
            margin-top: 20px;
            padding: 14px;
            background: #ffc733;
            color: #16202e;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
        }

        .newBtn:hover {
            background: #ffd45c;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><span>?</span>QuizMaker</div>
    </header>

    <div class="card">
        <h1>Resultat</h1>
        <!-- poeng, melding og svarene fylles inn av result.js -->
        <p id="score">0 / 0</p>
        <p id="msg"></p>

        <div id="resultList"></div>

        <a href="./" class="newBtn">Ny quiz</a>
    </div>

    <script src="result.js"></script>
</body>
</html>
